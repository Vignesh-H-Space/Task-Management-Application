<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Executive Intelligence & Reports | Tesseract</title>
  <meta name="description" content="Multi-horizon executive intelligence, velocity analytics, interactive data charts, and debrief reports.">
  <meta name="theme-color" content="#08080a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tesseract">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Mount Point -->
    <div id="sidebar-mount"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Header Mount Point -->
      <div id="header-mount"></div>

      <!-- Executive Report View -->
      <section class="report-view" id="report-view-container">
        <!-- Toolbar: Cadence, Period Navigation, Export Actions -->
        <div class="report-toolbar">
          <div class="report-toolbar-left">
            <!-- Cadence Selector -->
            <div class="cadence-toggle-group" id="cadence-toggle-group">
              <button class="btn-cadence active" data-cadence="weekly">
                <i data-lucide="calendar"></i>
                <span>Weekly Debrief</span>
              </button>
              <button class="btn-cadence" data-cadence="monthly">
                <i data-lucide="calendar-days"></i>
                <span>Monthly Review</span>
              </button>
              <button class="btn-cadence" data-cadence="yearly">
                <i data-lucide="trophy"></i>
                <span>Annual Retrospective</span>
              </button>
            </div>
          </div>

          <div class="report-toolbar-right">
            <!-- Period Navigator -->
            <div class="report-nav-controls">
              <button class="btn-report-nav" id="report-prev-btn" title="Previous Period" aria-label="Previous Period">
                <i data-lucide="chevron-left"></i>
              </button>
              <button class="btn-report-nav btn-report-current" id="report-current-btn" title="Jump to Current Period">
                <i data-lucide="clock"></i>
                <span>Current</span>
              </button>
              <button class="btn-report-nav" id="report-next-btn" title="Next Period" aria-label="Next Period">
                <i data-lucide="chevron-right"></i>
              </button>
              <span class="report-period-pill" id="report-period-badge">Loading...</span>
            </div>

            <!-- Export Suite -->
            <div class="report-export-actions">
              <button class="btn-export-action" id="btn-report-print" title="Print or Save as PDF">
                <i data-lucide="printer"></i>
                <span>Print</span>
              </button>
              <button class="btn-export-action" id="btn-report-download" title="Download Markdown (.md)">
                <i data-lucide="download"></i>
                <span>Export .md</span>
              </button>
              <button class="btn-export-action btn-export-primary" id="btn-report-copy" title="Copy Markdown Summary to Clipboard">
                <i data-lucide="copy"></i>
                <span>Copy Summary</span>
              </button>
              <button class="btn-export-action btn-export-share" id="btn-report-share" onclick="shareExecutiveReport()" title="Share Executive Debrief (Native Share)">
                <i data-lucide="share-2"></i>
                <span>Share</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Dynamic Content Mount injected by ReportEngine.render() -->
        <div id="report-content-mount">
          <!-- Injected dynamically -->
        </div>
      </section>
    </main>
  </div>

  <!-- Scripts -->
    <!-- Firebase Compat v10 SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- E2EE Sync Engine -->
  <script src="js/sync_engine.js"></script>
  <script src="js/components.js"></script>
  <script src="js/command_palette.js"></script>
  <script src="js/drag_drop.js"></script>
  <script src="js/initial_data.js"></script>
  <script src="js/xp_engine.js"></script>
  <script src="js/habits_engine.js"></script>
  <script src="js/rituals_engine.js"></script>
  <script src="js/roadmap_engine.js"></script>
  <script src="js/bucketlist_engine.js"></script>
  <script src="js/alignment_engine.js"></script>
  <script src="js/report_engine.js"></script>
  <script src="js/touch_engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

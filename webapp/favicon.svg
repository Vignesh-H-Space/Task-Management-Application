<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Rounded Background Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Tesseract Cube Icon -->
  <g>
    <!-- Top Face -->
    <polygon points="32,14 48,23 32,32 16,23" fill="url(#topFace)" />
    
    <!-- Left Face -->
    <polygon points="16,23 32,32 32,50 16,41" fill="url(#leftFace)" />
    
    <!-- Right Face -->
    <polygon points="32,32 48,23 48,41 32,50" fill="url(#rightFace)" />

    <!-- Inner Floating Cube Core -->
    <polygon points="32,24 40,28.5 32,33 24,28.5" fill="#f59e0b" fill-opacity="0.9" />
    <polygon points="24,28.5 32,33 32,42 24,37.5" fill="#d97706" fill-opacity="0.95" />
    <polygon points="32,33 40,28.5 40,37.5 32,42" fill="#b45309" fill-opacity="0.95" />
  </g>
</svg>

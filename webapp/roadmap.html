<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizon Timeline & Roadmap | Tesseract</title>
  <meta name="description" content="12-Month Executive Gantt & Strategic Roadmap timeline connecting Annual & Quarterly goals to deadlines.">
  <meta name="theme-color" content="#08080a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tesseract">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Mount Point -->
    <div id="sidebar-mount"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Header Mount Point -->
      <div id="header-mount"></div>

      <!-- Roadmap Timeline View -->
      <section class="roadmap-view" id="roadmap-view-container">
        <!-- View Toolbar & Navigation -->
        <div class="roadmap-toolbar">
          <div class="roadmap-toolbar-left">
            <h3 class="roadmap-toolbar-title">
              <i data-lucide="calendar-range"></i>
              <span id="roadmap-view-title">Horizon Roadmap & Gantt</span>
            </h3>
            <span class="roadmap-year-badge" id="roadmap-period-badge">2026 Flight Plan</span>
          </div>

          <div class="roadmap-toolbar-right">
            <!-- Period Navigation Controls -->
            <div class="roadmap-nav-controls">
              <button class="btn-roadmap-nav" id="roadmap-prev-btn" title="Previous period" aria-label="Previous period">
                <i data-lucide="chevron-left"></i>
              </button>
              <button class="btn-roadmap-nav btn-roadmap-today" id="roadmap-today-btn" title="Jump to Current Date" aria-label="Current period">
                <i data-lucide="clock"></i>
                <span>Today</span>
              </button>
              <button class="btn-roadmap-nav" id="roadmap-next-btn" title="Next period" aria-label="Next period">
                <i data-lucide="chevron-right"></i>
              </button>
            </div>

            <!-- Multi-Zoom Span Filter -->
            <div class="roadmap-filter-group" id="roadmap-zoom-group">
              <span class="filter-label">Span:</span>
              <button class="roadmap-zoom-btn" data-zoom="day">Day</button>
              <button class="roadmap-zoom-btn" data-zoom="week">Week</button>
              <button class="roadmap-zoom-btn" data-zoom="month">Month</button>
              <button class="roadmap-zoom-btn" data-zoom="quarter">Quarter</button>
              <button class="roadmap-zoom-btn active" data-zoom="year">Year</button>
            </div>
          </div>
        </div>

        <!-- Advanced Multi-Filter Toolbar -->
        <div class="roadmap-filters-bar">
          <div class="roadmap-filters-left">
            <!-- Horizon Tier Filter -->
            <div class="roadmap-filter-item">
              <label for="roadmap-tier-select"><i data-lucide="layers"></i> Horizon:</label>
              <select id="roadmap-tier-select" class="form-control form-control-sm">
                <option value="all">All Horizons</option>
                <option value="annual">🏆 Annual Vision</option>
                <option value="quarterly">🎯 Quarterly Goals</option>
                <option value="monthly">🗓️ Monthly Focus</option>
                <option value="weekly">📅 Weekly Milestones</option>
                <option value="daily">🌅 Daily Tasks</option>
              </select>
            </div>

            <!-- Category Filter -->
            <div class="roadmap-filter-item">
              <label for="roadmap-category-select"><i data-lucide="tag"></i> Category:</label>
              <select id="roadmap-category-select" class="form-control form-control-sm">
                <option value="all">All Categories</option>
                <option value="Product">Product</option>
                <option value="Engineering">Engineering</option>
                <option value="Career">Career</option>
                <option value="Finance">Finance</option>
                <option value="Health">Health</option>
                <option value="Personal">Personal</option>
              </select>
            </div>

            <!-- Priority Filter -->
            <div class="roadmap-filter-item">
              <label for="roadmap-priority-select"><i data-lucide="alert-circle"></i> Priority:</label>
              <select id="roadmap-priority-select" class="form-control form-control-sm">
                <option value="all">All Priorities</option>
                <option value="urgent">🚨 Urgent</option>
                <option value="high">🔥 High</option>
                <option value="medium">⚡ Medium</option>
                <option value="low">🌱 Low</option>
              </select>
            </div>

            <!-- Status Filter -->
            <div class="roadmap-filter-item">
              <label for="roadmap-status-select"><i data-lucide="check-circle-2"></i> Status:</label>
              <select id="roadmap-status-select" class="form-control form-control-sm">
                <option value="all">All Statuses</option>
                <option value="active">⏳ Active</option>
                <option value="completed">✅ Completed</option>
              </select>
            </div>
          </div>

          <div class="roadmap-filters-right">
            <!-- Filtered Task Count Pill -->
            <span class="roadmap-count-badge" id="roadmap-task-count">0 items</span>
            <!-- Reset Button -->
            <button class="btn-roadmap-reset" id="roadmap-reset-filters-btn" title="Reset all filters">
              <i data-lucide="rotate-ccw"></i>
              <span>Reset</span>
            </button>
          </div>
        </div>

        <!-- Main Gantt Canvas -->
        <div class="gantt-canvas-wrapper">
          <div class="gantt-canvas" id="gantt-canvas">
            <!-- Injected by RoadmapEngine.render() -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/components.js"></script>
  <script src="js/command_palette.js"></script>
  <script src="js/drag_drop.js"></script>
  <script src="js/initial_data.js"></script>
  <script src="js/xp_engine.js"></script>
  <script src="js/habits_engine.js"></script>
  <script src="js/rituals_engine.js"></script>
  <script src="js/roadmap_engine.js"></script>
  <script src="js/bucketlist_engine.js"></script>
  <script src="js/alignment_engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

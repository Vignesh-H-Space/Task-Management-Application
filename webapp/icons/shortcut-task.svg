<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141a" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile with gold border -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="rgba(245,158,11,0.3)" stroke-width="2" />

  <!-- Action Icon: Plus in Golden Badge -->
  <g transform="translate(96, 96)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="0" r="44" fill="rgba(245,158,11,0.12)" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="6 4" filter="url(#goldGlow)" />
    <!-- Solid Core Ring -->
    <circle cx="0" cy="0" r="34" fill="rgba(20,20,26,0.85)" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Plus Symbol -->
    <line x1="-18" y1="0" x2="18" y2="0" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="-18" x2="0" y2="18" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- Corner Sparkles -->
    <circle cx="28" cy="-28" r="3.5" fill="#fde68a" />
  </g>
</svg>

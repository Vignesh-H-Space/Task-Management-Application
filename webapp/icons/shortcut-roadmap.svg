<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141a" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile with gold border -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="rgba(245,158,11,0.3)" stroke-width="2" />

  <!-- Action Icon: Milestone Timeline / Roadmap -->
  <g transform="translate(96, 96)">
    <!-- Milestone Track 1 -->
    <rect x="-38" y="-30" width="76" height="14" rx="7" fill="rgba(245,158,11,0.15)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="-38" y="-30" width="46" height="14" rx="7" fill="url(#goldGrad)" />
    <circle cx="8" cy="-23" r="5.5" fill="#fde68a" filter="url(#goldGlow)" />

    <!-- Milestone Track 2 -->
    <rect x="-38" y="-6" width="76" height="14" rx="7" fill="rgba(245,158,11,0.15)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="-16" y="-6" width="54" height="14" rx="7" fill="url(#goldGrad)" />
    <circle cx="38" cy="1" r="5.5" fill="#fde68a" filter="url(#goldGlow)" />

    <!-- Milestone Track 3 -->
    <rect x="-38" y="18" width="76" height="14" rx="7" fill="rgba(245,158,11,0.15)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="-38" y="18" width="28" height="14" rx="7" fill="url(#goldGrad)" />
    <circle cx="-10" cy="25" r="5.5" fill="#fde68a" filter="url(#goldGlow)" />
  </g>
</svg>

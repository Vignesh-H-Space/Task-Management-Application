<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141a" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile with gold border -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="rgba(245,158,11,0.3)" stroke-width="2" />

  <!-- Action Icon: Trending Analytics & Velocity -->
  <g transform="translate(96, 96)">
    <!-- Base Axis Line -->
    <line x1="-36" y1="34" x2="36" y2="34" stroke="rgba(245,158,11,0.4)" stroke-width="3" stroke-linecap="round" />
    <!-- Bar Pillars -->
    <rect x="-30" y="8" width="10" height="26" rx="3" fill="rgba(245,158,11,0.2)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="-10" y="-8" width="10" height="42" rx="3" fill="rgba(245,158,11,0.3)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="10" y="-24" width="10" height="58" rx="3" fill="rgba(245,158,11,0.4)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Trending Up Path with Arrow -->
    <polyline points="-34,14 -16,-2 4,-14 26,-36" fill="none" stroke="#fde68a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />
    <!-- Arrowhead / Sparkle -->
    <polygon points="26,-36 16,-34 24,-24" fill="#fbbf24" />
  </g>
</svg>

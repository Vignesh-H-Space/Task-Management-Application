<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141a" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile with gold border -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="rgba(245,158,11,0.3)" stroke-width="2" />

  <!-- Action Icon: Executive Briefing & Debrief -->
  <g transform="translate(96, 96)">
    <!-- Document Card -->
    <rect x="-34" y="-44" width="68" height="88" rx="14" fill="rgba(245,158,11,0.1)" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#goldGlow)" />
    <!-- Executive Lines -->
    <line x1="-18" y1="-22" x2="18" y2="-22" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="-18" y1="-6" x2="10" y2="-6" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Micro Bar Chart in Report -->
    <line x1="-18" y1="26" x2="-18" y2="12" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="-6" y1="26" x2="-6" y2="6" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="6" y1="26" x2="6" y2="16" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="18" y1="26" x2="18" y2="2" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141a" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle gold border -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="rgba(245,158,11,0.3)" stroke-width="2" />

  <!-- Tesseract Cube / Diamond Symbol -->
  <g transform="translate(96,96) scale(1.15)">
    <!-- Outer Diamond / Cube -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round" filter="url(#goldGlow)" />
    
    <!-- Inner Tesseract Perspective Box -->
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="rgba(245,158,11,0.12)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Connecting Horizon Lines -->
    <line x1="0" y1="-48" x2="0" y2="-24" stroke="url(#goldGrad)" stroke-width="3" />
    <line x1="42" y1="-24" x2="21" y2="-12" stroke="url(#goldGrad)" stroke-width="3" />
    <line x1="42" y1="24" x2="21" y2="12" stroke="url(#goldGrad)" stroke-width="3" />
    <line x1="0" y1="48" x2="0" y2="24" stroke="url(#goldGrad)" stroke-width="3" />
    <line x1="-42" y1="24" x2="-21" y2="12" stroke="url(#goldGrad)" stroke-width="3" />
    <line x1="-42" y1="-24" x2="-21" y2="-12" stroke="url(#goldGrad)" stroke-width="3" />

    <!-- Center Pulse Core -->
    <circle cx="0" cy="0" r="5" fill="#fde68a" />
  </g>
</svg>
